<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tap a muscle for exercises, answer a few questions, and get a workout program built around your history, body and schedule.">
<meta name="theme-color" content="#e9edf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goliath">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html{-webkit-tap-highlight-color:transparent}</style>
<title>Goliath Strength Trainer App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Cinzel:wght@700;900&display=swap">
<style>
/* Layout: one-column phone app. Body map up top with the exercise sheet under it; the program is a one-question-per-screen intake that ends in a day-by-day plan. Fixed tab bar at the bottom. Plate colours (blue 20, yellow 15, green 10, red 25) are the semantic palette. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#111822; --muted:#566273; --line:#d3d9e1;
  --accent:#1f56d4; --accent-soft:#dfe7fa; --on-accent:#ffffff;
  --muscle:#c3ccd8; --muscle-hover:#a3b1c4; --base:#dde2e9; --dots:#cfd6df;
  --red:#cf3626; --red-soft:#fae2de; --yellow:#b88700; --yellow-soft:#f9eecd; --green:#1a8547; --green-soft:#d9efe1;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-brand:"Cinzel","Trajan Pro","Optima","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --surface-2:#1c2531; --ink:#e6ebf2; --muted:#93a0b2; --line:#283343;
  --accent:#5c8dff; --accent-soft:#1d2c4d; --on-accent:#0b1220;
  --muscle:#334054; --muscle-hover:#46566e; --base:#222c3a; --dots:#1d2632;
  --red:#ff7a66; --red-soft:#3a1d1a; --yellow:#e8bd45; --yellow-soft:#352b10; --green:#4fcf85; --green-soft:#143022;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --surface-2:#1c2531; --ink:#e6ebf2; --muted:#93a0b2; --line:#283343;
  --accent:#5c8dff; --accent-soft:#1d2c4d; --on-accent:#0b1220;
  --muscle:#334054; --muscle-hover:#46566e; --base:#222c3a; --dots:#1d2632;
  --red:#ff7a66; --red-soft:#3a1d1a; --yellow:#e8bd45; --yellow-soft:#352b10; --green:#4fcf85; --green-soft:#143022;
  color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{font-family:var(--f-brand);font-weight:900;font-size:clamp(21px,6.6vw,27px);letter-spacing:.07em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.mark span{display:grid;gap:5px;min-width:0}
.mark .logo{width:34px;height:34px;border-radius:8px;display:block;flex:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
@media (max-width:360px){.mark .logo{width:30px;height:30px}}
.mark small{font-family:var(--f-brand);font-size:clamp(8px,2.4vw,9.5px);font-weight:700;letter-spacing:.3em;color:var(--muted);display:flex;align-items:center;gap:6px}
.mark small::before,.mark small::after{content:"";height:1px;flex:1;min-width:6px;background:currentColor;opacity:.5}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Map */
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px 6px;
  background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:14px 14px}
.map svg{display:block;width:100%;height:auto;max-height:52vh;margin:0 auto}
.map .views{position:absolute;top:8px;left:8px;z-index:1}
.map .views button{padding:5px 10px;font-size:12px}
.top-r{display:flex;align-items:center;gap:8px;flex:none;min-height:38px}
.map .side{position:absolute;bottom:10px;left:14px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.map .heat-t{position:absolute;top:8px;right:8px}
.base *{fill:var(--base)}
.base .hair,.fig-hair{fill:var(--muscle-hover)}
.fig-bust{fill:color-mix(in srgb,var(--muscle) 80%,var(--ink) 20%)}
.map .fig-t{position:absolute;top:46px;left:8px}
.m{cursor:pointer;outline:none}
.m *{fill:var(--h,var(--muscle));stroke:var(--surface);stroke-width:1.4;transition:fill .15s}
.m:hover *{fill:var(--muscle-hover)}
.m.on *{fill:var(--accent)}
.heat .m *{fill:var(--h,var(--muscle))}
.heat .m.on *{stroke:var(--ink);stroke-width:2}
.deco{stroke:var(--surface);stroke-width:1.2;fill:none;pointer-events:none}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 6px 4px}
.legend .ramp{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--muscle),var(--accent))}

.scroller{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.ink.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 10px;font-size:12px}

.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 4px}
.mhead h2{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.9;margin:0;text-transform:uppercase;letter-spacing:.01em}
.mhead .anat{color:var(--muted);font-size:13px;margin-top:4px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.prio{margin-top:10px;width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--accent);text-align:left}
.prio.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden}
.ex{padding:14px 16px;display:grid;gap:5px}
.ex + .ex{border-top:1px solid var(--line)}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-name{font-weight:700;font-size:16px;min-width:0}
.lvl{display:flex;gap:2px;flex:none;align-items:flex-end}
.lvl span{width:5px;border-radius:1px;background:var(--line)}
.lvl span:nth-child(1){height:8px}.lvl span:nth-child(2){height:11px}.lvl span:nth-child(3){height:14px}
.lvl span.f{background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.tag.spot{background:var(--red-soft);color:var(--red)}
.tag.plan{background:var(--green-soft);color:var(--green)}
.tag.cmp{background:var(--accent-soft);color:var(--accent)}
.cue{color:var(--muted);font-size:14px}
.empty{padding:24px 16px;color:var(--muted);text-align:center}

/* Program */
.intro{padding-block:12px 0;display:grid;gap:16px}
.display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.005em;margin:0;text-wrap:balance}
.intro h1{font-size:52px}
.lede{color:var(--muted);font-size:16px;max-width:60ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.checks{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.checks li b{display:block}
.checks li span{color:var(--muted);font-size:14px}
.checks svg{margin-top:2px}
.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

.quiz{display:grid;gap:18px;padding-block:6px 0}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.progress .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.quiz h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.quiz .sub{color:var(--muted);margin:-8px 0 0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px}
.opt b{display:block;font-weight:650;font-size:15.5px}
.opt span{color:var(--muted);font-size:13px}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt.multi .dot{border-radius:5px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.opt:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-num{font-family:var(--f-display);font-weight:800;font-size:88px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:26px;font-weight:600}
.hint{text-align:center;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px;font:600 17px var(--f-body);font-variant-numeric:tabular-nums}
.inrow{display:flex;gap:8px}
.inrow .field{flex:1;min-width:0}
.stats{display:grid;gap:14px}
.field textarea{width:100%;min-width:0;min-height:84px;resize:vertical;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px;font:500 15px/1.4 var(--f-body)}
.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.read{font-size:13px;color:var(--muted);margin:-6px 0 0}
.read b{color:var(--ink)}
.phases{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:4px 0 8px}
.phases span{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;color:var(--ink)}
.ph-r{background:var(--yellow-soft)}.ph-b{background:var(--accent-soft)}.ph-d{background:var(--surface-2)}.ph-t{background:var(--green-soft)}
.ph-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ph-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.quote{font-size:14px;border-left:2px solid var(--line);padding:2px 0 2px 10px;color:var(--muted);margin:0 0 12px;font-style:italic}
.swap-btn{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--accent);grid-column:1 / -1;display:inline-flex;align-items:center;gap:5px}
.swap-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.swap-panel{grid-column:1 / -1;display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px;margin-top:4px}
.swap-panel .q{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.swap-panel .chips{display:flex;flex-wrap:wrap;gap:6px}
.alt{display:grid;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.alt:hover{border-color:var(--accent)}
.alt b{font-size:14.5px}
.alt span{font-size:12.5px;color:var(--muted)}
.swaps-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.swaps-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.swaps-list li > span{min-width:0}
.swaps-list s{color:var(--muted)}
.it .cueline{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.phys-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phys{display:grid;gap:2px;justify-items:center;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px 12px}
.phys svg{width:100%;max-width:120px;height:auto;display:block}
.phys b{font-weight:700;font-size:14.5px}
.phys span{font-size:12px;color:var(--muted);line-height:1.3}
.phys.on{border-color:var(--accent);background:var(--accent-soft)}
.fig-b{fill:var(--muscle);stroke:var(--muscle)}
.fig-h{fill:var(--accent);stroke:var(--accent)}
.fig-l{stroke:var(--accent-soft);stroke-width:1;fill:none}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;margin-bottom:10px}
.compare figure{margin:0;display:grid;justify-items:center;gap:4px}
.compare svg{width:100%;max-width:130px;height:auto}
.compare figcaption{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.compare .arrow{font-family:var(--f-display);font-size:28px;color:var(--muted);padding-bottom:60px}
.focus{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.navq{display:flex;gap:10px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:6px;background:linear-gradient(transparent,var(--bg) 30%)}
.navq .btn.ghost{flex:0 0 96px}

.res{display:grid;gap:14px;padding-block:6px 0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.res h1{font-size:46px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:14px}
.facts b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.panel h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0 0 10px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv b{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.bt-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 6px}
.bt-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.bt-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.insights{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.insights li{font-size:14px;padding-left:14px;position:relative}
.insights li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:1px;background:var(--accent)}
.insights li b{font-weight:650}

.daytabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left}
.daytab small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.daytab b{font-weight:700;font-size:14px}
.daytab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daytab.on small{color:var(--bg);opacity:.7}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.day-h h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase}
.day-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.daynote{padding:10px 16px;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.blk{padding:4px 0}
.blk + .blk{border-top:1px solid var(--line)}
.blk-label{display:flex;align-items:center;gap:8px;padding:10px 16px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.blk.grp .items{margin:6px 16px 6px 22px;border-left:2px solid var(--accent);}
.blk.grp .it{padding-left:12px;padding-right:0}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 16px}
.it .nm{font-weight:700;min-width:0}
.it .nm em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-right:6px}
.it .gq{font-size:12.5px;color:var(--muted)}
.dose{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;grid-row:span 2}
.dose b{display:block;font-size:15px;font-weight:600;white-space:nowrap}
.dose small{font-size:11px;color:var(--muted);white-space:nowrap}
.notes{grid-column:1 / -1;display:grid;gap:4px;margin-top:2px}
.note{font-size:12.5px;padding:6px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.note b{color:var(--ink);font-weight:650}
.note.t{background:var(--yellow-soft)} .note.t b{color:var(--yellow)}
.note.s{background:var(--red-soft)} .note.s b{color:var(--red)}
.note.p{background:var(--green-soft)} .note.p b{color:var(--green)}
.cardio{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.cardio .tag{flex:none}
.vol{display:grid;gap:7px}
.vrow{display:grid;grid-template-columns:86px 1fr 26px;gap:10px;align-items:center;font-size:13px}
.vtrack{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.vtrack .band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.vtrack .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--accent)}
.vrow .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.vnote{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center}
.vnote i{display:inline-block;width:18px;height:8px;border-radius:2px;background:var(--accent-soft)}
.gloss{display:grid;gap:10px;margin:0}
.gloss dt{font-weight:700}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:460px;margin:0 auto;display:flex;gap:8px}
.tabbar button{flex:1;border:0;background:none;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
.tabbar svg{width:22px;height:22px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:9;max-width:calc(100% - 32px);text-align:center}
/* gym mode */
.gym{display:grid;gap:12px;padding-block:4px 80px}
.gym-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gym-h h1{font-size:44px}
.gym-prog{text-align:right;font-family:var(--f-mono)}
.gym-prog b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.gym-prog small{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.gbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--green);transition:width .2s}
.daytab .up{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--green)}
.daytab.on .up{color:var(--bg)}
.g-primer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.g-primer summary{font-weight:700;cursor:pointer}
.g-primer ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.g-label{padding:10px 16px 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.g-item{display:grid;gap:10px;padding:14px 16px}
.g-item + .g-item{border-top:1px solid var(--line)}
.g-item.done .g-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.g-name{font-weight:750;font-size:19px;line-height:1.2;min-width:0;border:0;background:none;padding:0;text-align:left}
.g-name em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:6px}
.g-dose{font-family:var(--f-mono);font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.g-w{display:flex;align-items:center;gap:6px}
.g-w input{width:86px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px;font:600 20px var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
.g-w span{font-size:13px;color:var(--muted)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:600 15px var(--f-mono);color:var(--muted)}
.set.done{background:var(--green);border-color:var(--green);color:var(--surface)}
.g-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.g-detail{font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.g-cardio{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:14.5px}
.g-alt-btn{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);background:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:650;color:var(--ink)}
.g-alt-btn.on{border-style:solid;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g-item .swap-panel{margin-top:0}
.g-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted);background:var(--yellow-soft);border-radius:8px;padding:7px 10px}
.g-sub b{color:var(--ink)}
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar .in{max-width:460px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.restbar b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.restbar .trk{height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.restbar .trk i{display:block;height:100%;background:var(--bg)}
.restbar button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:none;color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.restbar.go .in{background:var(--green);color:var(--surface)}
/* workout review */
.g-w.r input{width:64px}
.tag.warn{background:var(--yellow-soft);color:var(--yellow)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 9px;display:grid;gap:3px;justify-items:center;min-width:0}
.rate b{font:800 28px/1 var(--f-display)}
.rate.nudge button{animation:nudge .5s 2}
@keyframes nudge{50%{border-color:var(--accent);background:var(--accent-soft)}}
.rate span{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.rate button.on{border-color:var(--accent);background:var(--accent-soft)}
.rate button.on b{color:var(--accent)}
.fb-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px 40px;gap:8px;align-items:center;padding:10px 0}
.fb-row + .fb-row{border-top:1px solid var(--line)}
.fb-row.off{opacity:.5}
.fb-row .nm{font-weight:650;font-size:14.5px;min-width:0;line-height:1.25}
.fb-row .nm small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.fb-row input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:9px 4px;font:600 16px var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
.fb-head{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px 40px;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.fb-head span:first-child{text-align:left}
.fb-cbtn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0;position:relative}
.fb-cbtn.has{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fb-cbtn.on{border-color:var(--ink);color:var(--bg);background:var(--ink)}
.fb-cwrap{grid-column:1 / -1;display:grid;gap:6px}
.fb-cwrap textarea{width:100%;min-width:0;min-height:58px;resize:vertical;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px;font:500 14.5px/1.4 var(--f-body)}
.fb-cwrap textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fb-cwrap .read{margin:0}
.fb-row.off .fb-cbtn,.fb-row.off .fb-cwrap{opacity:1}
.g-note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.g-note b{color:var(--ink);font-weight:650}
@media (max-width:360px){.fb-row,.fb-head{grid-template-columns:minmax(0,1fr) 62px 48px 38px;gap:6px}.fb-cbtn{width:38px;height:38px}}
.chg{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.chg li{font-size:14px;display:grid;gap:2px}
.chg li small{color:var(--muted);font-size:12.5px}
.chg .up{color:var(--green);font-family:var(--f-mono);font-weight:600}
.chg .dn{color:var(--red);font-family:var(--f-mono);font-weight:600}
.chg .eq{color:var(--muted);font-family:var(--f-mono);font-weight:600}
/* results grouping: one column on phones, two panes when there is room */
.res-cols,.res-side{display:contents}
.res-a,.res-b,.res-c{display:grid;gap:14px;min-width:0}
.res-b{order:1}.res-a{order:2}.res-c{order:3}.res-end{order:4}
.mside{display:block;min-width:0}
.gym-cards{display:grid;gap:12px}

/* Fold cover screen and other very narrow phones */
@media (max-width:360px){
  .mark{font-size:22px}
  .seg button{padding:6px 9px}
  .mhead h2{font-size:32px}
  .intro h1{font-size:40px}
  .res h1,.gym-h h1{font-size:34px}
  .quiz h2{font-size:27px}
  .display{letter-spacing:0}
  .big-num{font-size:70px}
  .opt{padding:11px 12px}
  .grid2{gap:6px}
  .kv{gap:6px}.kv div{padding:8px}.kv b{font-size:15px}
  .vrow{grid-template-columns:74px 1fr 24px;gap:8px}
  .set{width:40px;height:40px;font-size:14px}
  .sets{gap:6px}
  .g-w input{width:70px;font-size:18px}
  .g-name{font-size:17px}
  .compare .arrow{display:none}
  .tabbar button{font-size:11px;padding:7px 4px}
  .daytab{padding:7px 10px}
}

/* Fold inner screen, tablets, desktop */
@media (min-width:600px){
  .app{max-width:1080px}
  .tabbar .in{max-width:560px}
  .restbar .in{max-width:560px}
  #tabBody:not([hidden]){display:grid;grid-template-columns:minmax(260px,5fr) minmax(0,7fr);gap:24px;align-items:start}
  #tabBody .map{position:sticky;top:calc(62px + env(safe-area-inset-top,0px))}
  .map svg{max-height:calc(100vh - 230px)}
  .mside .scroller:first-child{padding-top:0}
  .intro,.quiz{max-width:660px;margin-inline:auto;width:100%}
  .phys-grid{grid-template-columns:repeat(3,1fr)}
  .opts{grid-template-columns:1fr 1fr}
  .opts:has(> :only-child){grid-template-columns:1fr}
  .grid2{grid-template-columns:repeat(3,1fr)}
  .navq{max-width:660px}
  .gym-cards{grid-template-columns:1fr 1fr;align-items:start}
  .gym-cards .g-cardio{grid-column:1 / -1}
}
@media (min-width:760px){
  .res-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
  .res-side{display:grid;gap:14px;grid-column:2;grid-row:1}
  .res-a{grid-column:1;grid-row:1}
  .res h1{font-size:56px}
}

/* Foldables reporting two side-by-side screen segments: keep content off the hinge */
@media (horizontal-viewport-segments: 2){
  .app{max-width:none}
  #tabBody:not([hidden]),.res-cols,.gym-cards{grid-template-columns:1fr 1fr;column-gap:calc(env(viewport-segment-left 1 0, 0px) - env(viewport-segment-right 0 0, 0px) + 32px)}
  .res-side{grid-column:2}
}
/* Half-folded (tabletop): keep the gym checklist on the bottom half */
@media (vertical-viewport-segments: 2){
  #tabGym .gym-h{min-height:calc(env(viewport-segment-height 0 0, 0px) - 120px)}
}
/* plan type switch + builder */
.seg.pv{width:max-content;max-width:100%;margin:2px 0 12px}
.seg.pv button{padding:7px 14px}
.bld{display:grid;gap:14px}
.bld h1{font-size:46px}
.bpair{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:340px;margin:0 auto}
.bpair figure{margin:0;display:grid;justify-items:center;gap:2px}
.bpair svg{width:100%;height:auto;display:block;max-height:260px}
.bpair figcaption{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bpair .m{cursor:default}
.bpair .m:hover *{fill:var(--h,var(--muscle))}
.bpair.pick .m{cursor:pointer}
.bpair.pick .m:hover *{fill:var(--muscle-hover)}
.bpair.pick .m.on *{fill:var(--accent)}
.bnote{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.bnote b{color:var(--ink)}
.bnote.warn b{color:var(--red)}
.bnote.ok b{color:var(--green)}
.vdet{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.vdet summary{font-weight:700;cursor:pointer}
.vrow.bv .n small{color:var(--muted);font-size:11px;margin-left:2px}
.vrow.bv{grid-template-columns:86px 1fr 44px}
.vtrack .fill.ind{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:0 3px 3px 0}
.daytab.add{border-style:dashed;color:var(--accent)}
.ib.trash{width:40px;height:40px;color:var(--red);flex:none;align-self:flex-end}
.ib.trash:hover{background:var(--red-soft);border-color:var(--red)}
.delbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--red-soft);border-bottom:1px solid var(--line);font-size:14px}
.delbar span{flex:1 1 160px}
.chip.del{color:var(--surface);background:var(--red);border-color:var(--red);display:inline-flex;align-items:center;gap:5px}
.bday .day-h{align-items:flex-end}
.bday-map{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bday-map .bpair{max-width:240px}
.blist{display:grid}
.bit{display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bit.ss{border-left:3px solid var(--accent);padding-left:13px}
.bit-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bit-name{font-weight:700;font-size:15.5px;min-width:0}
.bit-name em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.bit-name small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.bit-move{display:flex;gap:4px;flex:none}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.3;cursor:default}
.bit-ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp b{font-family:var(--f-mono);font-size:17px;min-width:18px;text-align:center}
.stp small,.bf small{font-size:12px;color:var(--muted)}
.bf{display:inline-flex;align-items:center;gap:5px}
.bf input,.bf select{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:7px 8px;font:600 14px var(--f-mono);width:74px}
.bf select{width:auto}
.bpick-wrap{padding:14px 16px;border-bottom:1px solid var(--line)}
.bpick{display:grid;gap:10px}
.bpick-h{display:flex;justify-content:space-between;align-items:center}
.bpick .bpair{max-width:260px}
.bpick .list{margin-top:0}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 14px}
.pk + .pk{border-top:1px solid var(--line)}
.pk b{display:block;font-size:14.5px}
.pk small{font-size:12px;color:var(--muted)}
.pk i{font-style:normal;font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
.pk.has i{color:var(--green)}
.tplrow{display:grid;gap:8px;padding:14px 16px}
.tplrow .chips{display:flex;flex-wrap:wrap;gap:6px}
.panel .tplrow{padding:0}
.bday-act{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.buse{display:grid;gap:8px}
.buse span{color:var(--muted);font-size:14px}
.bm-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.bm-days{display:flex;flex-wrap:wrap;gap:6px}
.bhead{display:grid;gap:10px;justify-items:start}
.bhead .field{width:100%}
.seg.kind{max-width:100%}
.seg.kind button{padding:7px 11px}
.newgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.newb{display:grid;gap:4px;align-content:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px}
.newb b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.newb span{font-size:12.5px;color:var(--muted);line-height:1.3}
.newb:hover{border-color:var(--accent)}
.blib{display:grid;gap:8px}
.bcard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bcard.act{border-color:var(--green)}
.bcard-fig{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.bcard-fig svg{width:100%;height:auto;display:block}
.bcard-main{display:grid;gap:4px;justify-items:start;min-width:0}
.bcard-main b{font-size:16px}
.bcard-main small{font-size:12.5px;color:var(--muted)}
.bcard-act{display:flex;gap:6px;margin-top:2px}
.prog{display:grid;gap:12px}
.prog h3{margin:0}
.tl{display:flex;flex-wrap:wrap;gap:3px}
.tw{flex:1 0 22px;max-width:40px;height:26px;border-radius:5px;display:grid;place-items:center;font:600 10.5px var(--f-mono);color:var(--ink);position:relative}
.tw.sel{outline:2px solid var(--ink);outline-offset:-2px}
.tw.now::after{content:"";position:absolute;bottom:-6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--green)}

.tl-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.tl-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tl-leg i.dlk{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,color-mix(in srgb,var(--ink) 30%,transparent) 3px 5px)}

.phset{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.prog .chips{display:flex;flex-wrap:wrap;gap:6px}
.tobuild{display:grid;gap:8px;margin-top:14px}
.tobuild span{color:var(--muted);font-size:14px}
#tabBuild{padding-block:6px 0}
@media (max-width:420px){.newgrid{grid-template-columns:1fr}.newb{grid-template-columns:auto 1fr;align-items:baseline;gap:4px 10px}.newb b{font-size:18px}}
@media (min-width:600px){.blib{grid-template-columns:1fr 1fr}.lib{max-width:900px;margin-inline:auto}}
@media (min-width:760px){
  .bld.ed:not(.one){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start;column-gap:20px}

const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,a:1,an:1,couple:2,few:3,several:3};
const NW='(\\d+(?:\\.\\d+)?|'+Object.keys(NUMW).join('|')+')';
const numW=s=>isNaN(+s)?(NUMW[s]||0):+s;
const unitV=u=>!u?0:u[0]==='y'?1:u[0]==='m'?1/12:1/52;
function parseHistory(t){
  t=(t||'').toLowerCase().replace(/[’]/g,"'");if(!t.trim())return null;
  const stalled=/lost steam|lost motivation|fell off|quit|gave up|couldn't stick|on and off|off and on|stopped going|didn't stick|burn(ed|t) out/.test(t);
  t=t.replace(/on and off|off and on/g,'inconsistently');
  const r={lifted:null,off:null,stalled,brk:false};
  const offRe=new RegExp('(?:took|taken|take|had|been|was)\\s+(?:about\\s+|around\\s+|like\\s+)?'+NW+'\\s*(?:\\+\\s*)?(years?|yrs?|months?|mos?|weeks?|wks?)?\\s*(?:off|away|break)','g');
  const ranges=[];let m,unitless=null;
  while((m=offRe.exec(t))){ranges.push([m.index,m.index+m[0].length]);if(m[2])r.off=Math.max(r.off||0,numW(m[1])*unitV(m[2]));else unitless=numW(m[1]);}
  const re=new RegExp('\\b'+NW+'\\s*(?:\\+\\s*)?(years?|yrs?|months?|mos?|weeks?|wks?)\\b','g');
  let firstUnit=null;
  while((m=re.exec(t))){
    if(ranges.some(([a,b])=>m.index>=a&&m.index<b))continue;
    const val=numW(m[1])*unitV(m[2]);if(!firstUnit)firstUnit=unitV(m[2]);
    const after=t.slice(m.index+m[0].length,m.index+m[0].length+14),before=t.slice(Math.max(0,m.index-22),m.index);
    if(/(last|past)\s*$/.test(before))continue;
    if(/^\s*(off|away|break|hiatus|out|ago)/.test(after)||/(break of|off for|away for|out for|hiatus of|haven't lifted (in|for)|not lifted (in|for)|stopped for)\s*(about|around)?\s*$/.test(before))r.off=Math.max(r.off||0,val);
    else r.lifted=Math.max(r.lifted||0,val);
  }
  if(unitless!=null)r.off=Math.max(r.off||0,unitless*(firstUnit||1));
  r.brk=r.off!=null||/\b(break|hiatus|coming back|getting back|returning|back into it|time off)\b/.test(t);
  return r;
}

  }

  if(attrs.has('a_end'))strAdj.push('<b>Endurance:</b> rests on isolation work are cut by about a quarter. Your conditioning can handle it, and it makes sessions shorter.');
  if(attrs.has('a_str'))strAdj.push('<b>Raw strength:</b> your main lifts are where progress will show first. Track them every session.');
  if(attrs.has('a_mob'))strAdj.push('<b>Flexibility:</b> use it. Go for the deepest stretch you can control at the bottom of each rep. Stretched reps build muscle well.');
  if(attrs.has('a_pow'))strAdj.push('<b>Explosiveness:</b> main lifts are cued for maximum bar speed.');
  if(attrs.has('a_grip'))strAdj.push('<b>Grip:</b> direct forearm work is kept to maintenance, and you can skip straps on pulls.');
  const physNotes=[];
  if(phyDef(phys)){
    if((phys==='muscular'||phys==='power')&&bt.dom==='ecto')physNotes.push('Your frame gains slowly, so this is a 12 to 24 month project. Eating in a surplus matters as much as the lifting.');
    else if((phys==='lean'||phys==='athletic')&&bt.dom==='endo')physNotes.push('Definition shows as body fat comes down, so fat loss leads. The focus muscles keep your shape while you lean out.');
    else if(phys==='power'&&bt.dom==='endo')physNotes.push('Your build already leans this way. Heavy compound lifts will turn size you carry into strength quickly.');
    else if((phys==='athletic'||phys==='muscular')&&bt.dom==='meso')physNotes.push('Your build is a strong match for this target. Expect visible change in 8 to 12 consistent weeks.');
    else physNotes.push('Expect the first visible change in 8 to 12 consistent weeks, with bigger shifts across 6 to 12 months.');
    if(phys==='athletic')physNotes.push(fem()?'An athletic shape comes from strong glutes, capped shoulders and a defined back, so those get the extra work.':'A V-taper comes from wide lats and side delts plus a tight waist, so lats and shoulders get the extra work.');
    if(phys==='curves')physNotes.push('An hourglass look comes from building the shoulders and glutes, which makes the waist look smaller. Direct oblique loading is left out so the waist does not thicken.');
    if(phys==='power')physNotes.push('Main lifts run heavy: 5 sets of 3 to 5 reps with long rests.');
    if(phys==='lean')physNotes.push('Accessories run 12 to 20 reps with short rests, and cardio is bumped up.');
    if(goal==='fat'&&(phys==='muscular'||phys==='power'))physNotes.push('You picked fat loss with a muscular target, so the plan runs as a recomposition: a small deficit, high protein and heavy lifting.');
    if(goal==='muscle'&&(phys==='lean'||phys==='toned'))physNotes.push('The calorie surplus is kept small so you add muscle without losing definition.');
  }
  let protBase=mt.gk||mt.kg;if(!mt.gk&&bmi>30)protBase=27*(mt.cm/100)**2;

}

function swapCands(it){

function renderPicker(C){

    ${hid?`<button class="chip sm" data-bshowall="1">${S.bShowAll?'Hide':'Show'} ${hid} that don't fit your equipment or injuries</button>`:''}
  </div>`;
}
function bRender(){const y=scrollY;renderBuildTab();window.scrollTo(0,y);}
function bMut(fn){fn(custDays());save();rebuild();bRender();}
function bMutB(fn){const b=curBuild();if(!b)return;fn(b);save();rebuild();bRender();}
// every place an exercise can go: build, phase, day
function addTargets(){const out=[];builds().forEach(b=>b.phases.forEach((p,pi)=>{if(b.kind!=='program'&&pi>0)return;(b.kind==='day'?p.days.slice(0,1):p.days).forEach((d,di)=>out.push({key:`${b.id}|${pi}|${di}`,label:b.kind==='day'?b.name:`${b.name} · ${b.kind==='program'?p.name+' · ':''}${d.name||'Day '+(di+1)}`}));}));return out;}

function rebuild(){PLAN=A.done&&statsOk(A)?build(A):null;if(!PLAN)A.done=false;CPLAN=buildCustom();GP=(A.mode==='custom'&&CPLAN)?CPLAN:(PLAN||CPLAN);}

  if(t.dataset.bkind){bMutB(b=>{const k=t.dataset.bkind;if(k===b.kind)return;if(k==='program'){b.phases[0].weeks=Math.max(4,+b.phases[0].weeks||1);if(b.deload==null)b.deload=4;b.prog=b.prog||'load';}else{b.phases=b.phases.slice(0,1);if(k==='day'&&b.phases[0].days.length>1)toast('A single workout uses Day 1. The other days stay saved if you switch back.');}b.kind=k;S.bPh=0;S.bDay=0;});return;}

  if(t.dataset.bdel!=null){bMut(d=>{const L=d[S.bDay].items;L.splice(+t.dataset.bdel,1);if(L.length)L[L.length-1].ss=false;});return;}
  if(t.dataset.bss!=null){bMut(d=>{const L=d[S.bDay].items,i=+t.dataset.bss,x=L[i];x.ss=!x.ss;if(x.ss&&L[i+1])L[i+1].sets=x.sets;});return;}
  if(t.dataset.bdup){bMut(d=>{const src=d[S.bDay];d.splice(S.bDay+1,0,{id:uid('d'),name:(src.name||'Day')+' (copy)',items:JSON.parse(JSON.stringify(src.items))});S.bDay++;});return;}
  if(t.dataset.bdeld){S.bConfirmDel=!S.bConfirmDel;bRender();return;}
  if(t.dataset.bdelno){S.bConfirmDel=false;bRender();return;}
  if(t.dataset.bdelyes){const nm=(custDays()[S.bDay]||{}).name||'Day';bMut(d=>{d.splice(S.bDay,1);if(!d.length)d.push({id:uid('d'),name:'Day 1',items:[]});S.bDay=Math.max(0,S.bDay-1);S.bConfirmDel=false;});toast(nm+' removed');return;}
  if(t.dataset.bvol){S.bVol=!S.bVol;return;}
  if(t.id==='saveBtn'){S.saving=!S.saving;if(S.tab==='build')bRender();else renderPlan();if(S.saving){const i=$('#planName');i&&i.focus();}return;}
  if(t.id==='saveCancel'){S.saving=false;if(S.tab==='build')bRender();else renderPlan();return;}
  if(t.id==='saveUpd'||t.id==='saveNew'){savePlan(t.id==='saveNew',($('#planName')||{}).value);return;}
  if(t.dataset.load){loadPlan(t.dataset.load);return;}
  if(t.dataset.del){S.confirmDel=t.dataset.del;if(S.tab==='gym')renderGym();else renderPlan();return;}
  if(t.dataset.delno){S.confirmDel=null;if(S.tab==='gym')renderGym();else renderPlan();return;}
  if(t.dataset.delyes){deletePlan(t.dataset.delyes);return;}
  if(t.dataset.gday){S.gymDay=+t.dataset.gday;S.gymOpen=null;S.galt=null;renderGym();return;}
  if(t.dataset.gopen){S.gymOpen=S.gymOpen===t.dataset.gopen?null:t.dataset.gopen;renderGym();return;}
  if(t.dataset.set){const k=t.dataset.set;if(CHECKS.has(k)){CHECKS.delete(k);}else{CHECKS.add(k);startRest(+t.dataset.rest||0);}saveChecks();renderGym();return;}
  if(t.id==='restSkip'){startRest(0);return;}
  if(t.id==='backupBtn'){backup();return;}
  if(t.dataset.galt){S.galt=S.galt===t.dataset.galt?null:t.dataset.galt;renderGym();return;}
  if(t.dataset.galtpick&&S.galt){
    const k=S.galt,orig=k.slice(k.indexOf('|')+1),pick=t.dataset.galtpick;
    if(pick===orig)delete SUBS.map[k];else SUBS.map[k]=pick;saveSubs();S.galt=null;renderGym();
    toast(pick===orig?'Back to '+orig:'Using '+pick+' today');return;
  }
  if(t.dataset.gkeep){
    const k=t.dataset.gkeep,orig=k.slice(k.indexOf('|')+1),to=SUBS.map[k];if(!to)return;
    const it=GP.days_.flatMap(d=>d.blocks.flatMap(b=>b.items)).find(x=>x.e.name===orig);
    A.swaps=(A.swaps||[]).filter(x=>x.to!==orig);A.swaps.push({from:orig,to,g:it?it.e.g:''});
    Object.keys(SUBS.map).forEach(key=>{if(key.endsWith('|'+orig)){const n=key.slice(0,key.indexOf('|'));const sets=[...CHECKS].filter(c=>c.startsWith(key+'|'));sets.forEach(c=>{CHECKS.delete(c);CHECKS.add(n+'|'+to+c.slice(key.length));});delete SUBS.map[key];}});
    saveSubs();saveChecks();save();rebuild();renderGym();toast(to+' replaces '+orig+' from now on');return;
  }
  if(t.id==='finishBtn'){S.review={di:S.gymDay,rating:0,comment:'',rows:reviewRows(S.gymDay)};startRest(0);renderGym();window.scrollTo(0,0);return;}
  if(t.dataset.fbc!=null&&S.review&&S.review.rows){const i=+t.dataset.fbc,r=S.review.rows[i];r.co=!r.co;renderGym();if(r.co){const ta=$('#fbc-'+i);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}}return;}
  if(t.dataset.rate&&S.review){S.review.rating=+t.dataset.rate;renderGym();return;}
  if(t.id==='fbBack'){S.review=null;renderGym();return;}
  if(t.id==='fbSave'&&S.review){
    if(!S.review.rating){const g=$('.rate');if(g){g.scrollIntoView({block:'center',behavior:'smooth'});g.classList.remove('nudge');void g.offsetWidth;g.classList.add('nudge');}toast('Tap a rating from 1 to 5 first, then save.');return;}
    submitReview();toast('Workout saved');return;
  }
  if(t.id==='fbDone'){S.review=null;renderGym();window.scrollTo(0,0);toast('Next up: '+GP.days_[NEXT%GP.days_.length].name);return;}

  if(t.dataset.view){S.view=t.dataset.view;renderBody();return;}
  if(t.closest('#fig')&&t.dataset.m){selectMuscle(t.dataset.m);return;}
  if(t.closest('#mChips')&&t.dataset.m){selectMuscle(t.dataset.m);return;}
  if(t.dataset.eq){S.eq=t.dataset.eq;renderChips();renderList();return;}
  if(t.id==='heatBtn'){S.heat=!S.heat;renderFig();return;}
  if(t.id==='prioBtn'){
    const p=A.priority||[];const i=p.indexOf(S.sel);
    if(i>=0)p.splice(i,1);else{if(p.length>=4){toast('Four priority muscles max. Remove one first.');return;}p.push(S.sel);}
    A.priority=p;save();rebuild();renderBody();
    toast(PLAN?'Program updated':(i>=0?'Removed from priorities':'Saved. It will be used when you build your program.'));return;
  }
  if(t.id==='startBtn'){S.quiz=true;S.step=Math.max(0,visQ().findIndex(q=>!canNext(q)));if(S.step<0)S.step=0;renderPlan();return;}
  if(t.id==='editBtn'){S.quiz=true;S.step=0;renderPlan();window.scrollTo(0,0);return;}
  if(t.id==='resetBtn'){A=defaults();save();PLAN=null;S.quiz=false;S.step=0;S.day=0;renderPlan();window.scrollTo(0,0);return;}
  if(t.dataset.day){S.day=+t.dataset.day;S.swapKey=null;renderPlan();return;}
  if(t.dataset.swap){S.swapKey=S.swapKey===t.dataset.swap?null:t.dataset.swap;S.swapReason=S.swapReason||'like';renderPlan();return;}
  if(t.dataset.reason){S.swapReason=t.dataset.reason;renderPlan();return;}
  if(t.dataset.swapto&&S.swapKey){
    const [d,b,i]=S.swapKey.split('-').map(Number);const it=PLAN.days_[d].blocks[b].items[i];
    const from=it.e.name,to=t.dataset.swapto;
    const sw=A.swaps=A.swaps||[];
    const chain=sw.find(x=>x.to===from);
    if(chain){if(chain.from===to)sw.splice(sw.indexOf(chain),1);else chain.to=to;}
    else sw.push({from,to,g:it.e.g});
    S.swapKey=null;save();rebuild();renderPlan();
    toast(`Swapped ${chain?chain.from:from} for ${to} across your plan`);return;
  }
  if(t.dataset.unswap){const x=A.swaps.splice(+t.dataset.unswap,1)[0];save();rebuild();renderPlan();toast(`${x.from} is back in the mix`);return;}

  if(S.quiz){
    const VQ=visQ();const q=VQ[S.step];
    if(t.id==='backQ'){if(S.step===0){S.quiz=false;}else S.step--;renderPlan();return;}
    if(t.id==='nextQ'){
      if(!canNext(q))return;
      if(q.id==='exp'){applyParsed();save();}
      if(S.step<visQ().length-1){S.step++;renderPlan();window.scrollTo(0,0);}
      else{A.done=true;save();rebuild();S.quiz=false;S.day=0;renderPlan();window.scrollTo(0,0);}
      return;
    }
    if(t.id==='dec'||t.id==='inc'){A.days=Math.min(q.max,Math.max(q.min,A.days+(t.id==='inc'?1:-1)));save();renderPlan();return;}
    if(t.dataset.units){
      const m0=metrics(A);A.units=t.dataset.units;
      if(m0.kg>0){if(A.units==='imp'){A.lb=Math.round(m0.kg/0.453592);const ti=Math.round(m0.cm/2.54);A.ft=Math.floor(ti/12);A.inch=ti%12;if(m0.gk)A.goalW=Math.round(m0.gk/0.453592);}else{A.kg=Math.round(m0.kg);A.cm=Math.round(m0.cm);if(m0.gk)A.goalW=Math.round(m0.gk);}}
      save();renderPlan();return;
    }
    if(t.dataset.ago){A.liftsAgo=+t.dataset.ago;save();renderPlan();return;}
    if(t.dataset.sex){A.sex=t.dataset.sex;if(t.dataset.sex!=='x')A.fig=t.dataset.sex;if(t.dataset.sex!=='f'){delete A.cycle;delete A.preg;}save();renderPlan();return;}
    if(t.dataset.figset){A.fig=t.dataset.figset;if(A.phys&&!phyDef(A.phys))delete A.phys;else if(A.phys&&!phyList()[A.phys])delete A.phys;save();renderPlan();return;}
    if(t.dataset.v){
      const v=t.dataset.v;
      if(q.type==='single'||q.type==='phys'){
        A[q.id]=v;
        if(q.id==='history'&&v!=='break')delete A.breakLen;
        save();renderPlan();
        if(q.noAuto){if(v==='other'){const ta=$('#noteTA');if(ta)ta.focus();}return;}
        setTimeout(()=>{const V=visQ();if(V[S.step]===q&&S.step<V.length-1){S.step++;renderPlan();window.scrollTo(0,0);}},220);return;
      }
      if(q.type==='multi'){
        let arr=[...(A[q.id]||[])];
        if(arr.includes(v))arr=arr.filter(x=>x!==v);
        else{if(q.excl===v)arr=[v];else{arr=arr.filter(x=>x!==q.excl);if(!q.max||arr.length<q.max)arr.push(v);}}
        A[q.id]=arr;save();renderPlan();return;
      }
    }
  }
});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('#fig .m')){ev.preventDefault();selectMuscle(ev.target.dataset.m);}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.bpair.pick .m')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='restoreIn'&&t.files&&t.files[0]){restore(t.files[0]);t.value='';return;}
  if(t.dataset&&t.dataset.breps!=null){const v=t.value.trim()||'10';bMut(d=>{d[S.bDay].items[+t.dataset.breps].reps=v;});return;}
  if(t.dataset&&t.dataset.brest!=null){bMut(d=>{d[S.bDay].items[+t.dataset.brest].rest=+t.value;});return;}
  if(t.dataset&&t.dataset.bname){bMut(d=>{d[S.bDay].name=t.value.trim()||('Day '+(S.bDay+1));});return;}
  if(t.dataset&&t.dataset.btitle){bMutB(b=>{b.name=t.value.trim()||KIND_N[b.kind];});return;}
  if(t.dataset&&t.dataset.bphname){bMutB(b=>{b.phases[S.bPh].name=t.value.trim()||('Phase '+(S.bPh+1));});return;}
  if(t.dataset&&t.dataset.wname){
    const v=t.value.trim();
    const n=t.dataset.wname,o=LOG[n];
    if(v===''){if(o){delete o.w;if(o.r==null)delete LOG[n];}}else{const num=+v;if(!(num>=0&&num<2000))return;
      const pw=o&&o.w!=null&&new Date(o.at).toDateString()!==today()?o.w:(o?o.pw:undefined);
      LOG[n]=Object.assign({},o||{},{w:num,at:Date.now()});if(pw!=null)LOG[n].pw=pw;else delete LOG[n].pw;}
    writeProfile();
  }
  if(t.dataset&&t.dataset.rname){
    const n=t.dataset.rname,v=t.value.trim();
    if(v===''){if(LOG[n]){delete LOG[n].r;delete LOG[n].rat;}}else{const num=parseInt(v,10);if(!(num>0&&num<200))return;LOG[n]=Object.assign({},LOG[n]||{},{r:num,rat:Date.now()});}
    writeProfile();
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='planName'){ev.preventDefault();savePlan(!A.savedId,ev.target.value);}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(S.review&&S.review.rows){
    if(t.id==='fbNote'){S.review.comment=t.value;const ro=$('#fbRead');if(ro)ro.innerHTML=readFeedback(t.value,S.review.rows);return;}
    if(t.dataset.fbw!=null){const r=S.review.rows[+t.dataset.fbw];r.w=t.value.trim();if(r.w!==''&&!r.use){r.use=true;t.closest('.fb-row').classList.remove('off');}return;}
    if(t.dataset.fbr!=null){S.review.rows[+t.dataset.fbr].r=t.value.trim();return;}
    if(t.dataset.fbcn!=null){const i=+t.dataset.fbcn,r=S.review.rows[i];r.c=t.value;const ro=$('#fbcr-'+i);if(ro)ro.innerHTML=readRow(t.value,r);const b=t.closest('.fb-row').querySelector('.fb-cbtn');if(b)b.classList.toggle('has',!!t.value.trim());return;}
  }
  if(!S.quiz)return;
  if(t.id==='hrs'){A.hours=+t.value;$('#hrsN').textContent=fmtH(A.hours);$('#hrsHint').innerHTML=`About <b>${Math.round(A.hours*60/A.days)} min</b> per session across ${A.days} days`;save();return;}
  const map={ft:'ft',inch:'inch',cm:'cm',age:'age',goalW:'goalW'};
  if(map[t.id])A[map[t.id]]=t.value;
  if(t.id==='wt'){if(A.units==='imp')A.lb=t.value;else A.kg=t.value;}
  if(t.dataset.lift){A.lifts=A.lifts||{};A.lifts[t.dataset.lift]=t.value;const nb=$('#nextQ');if(nb)nb.textContent=hasLifts()?'Next':'Skip';}
  if(t.dataset.note){A[t.dataset.note]=t.value;const ro=$('#readOut');if(ro)ro.innerHTML=readText();}
  save();const nb=$('#nextQ');if(nb)nb.disabled=!canNext(visQ()[S.step]);
});

builds();
if(location.hash==='#gym')S.tab='gym';
rebuild();render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const t0=Date.now(),had=!!navigator.serviceWorker.controller;let reloaded=false;
  // a new version took over right after opening: reload once so the new code runs now, not next launch
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded&&Date.now()-t0<15000&&!S.review){reloaded=true;location.reload();}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
}
</script>
